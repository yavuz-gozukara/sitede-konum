<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Oyuncular</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { font-size: 18px; margin-bottom: 16px; }
  .login-box {
    max-width: 320px;
    margin: 60px auto;
    background: #111c31;
    border: 1px solid #1e293b;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }
  .login-box input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #1e293b;
    background: #0b1220;
    color: #e2e8f0;
    margin: 10px 0;
  }
  .login-box button, .refresh-btn {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #3b82f6;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  .error { color: #fca5a5; font-size: 12px; margin-top: 8px; min-height: 14px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #111c31;
    border-radius: 10px;
    overflow: hidden;
    font-size: 13px;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid #1e293b;
  }
  th { background: #0f172a; color: #93c5fd; font-size: 11px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .refresh-btn { width: auto; padding: 8px 16px; font-size: 13px; }
  .count { font-size: 12px; color: #64748b; margin-bottom: 10px; }
  #dashboard { display: none; }
</style>
</head>
<body>

<div class="login-box" id="loginBox">
  <h1>🔒 Admin Girişi</h1>
  <input type="password" id="secretInput" placeholder="Admin şifresi">
  <button id="loginBtn">Giriş Yap</button>
  <div class="error" id="loginError"></div>
</div>

<div id="dashboard">
  <div class="top-bar">
    <h1>👥 Oyuncular</h1>
    <button class="refresh-btn" id="refreshBtn">🔄 Yenile</button>
  </div>
  <div class="count" id="countText"></div>
  <table>
    <thead>
      <tr>
        <th>Oyuncu Adı</th>
        <th>Şehir / Ülke</th>
        <th>Bakiye</th>
        <th>Son Görülme</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
const loginBox = document.getElementById('loginBox');
const dashboard = document.getElementById('dashboard');
const secretInput = document.getElementById('secretInput');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const tableBody = document.getElementById('tableBody');
const countText = document.getElementById('countText');
const refreshBtn = document.getElementById('refreshBtn');

let adminSecret = sessionStorage.getItem('admin_secret') || '';

async function loadPlayers() {
  try {
    const res = await fetch('/api/admin-players', {
      headers: { 'x-admin-secret': adminSecret }
    });
    if (res.status === 401) {
      loginError.textContent = 'Yanlış şifre.';
      sessionStorage.removeItem('admin_secret');
      loginBox.style.display = 'block';
      dashboard.style.display = 'none';
      return;
    }
    const data = await res.json();
    const players = data.players || [];
    countText.textContent = `Toplam ${players.length} oyuncu`;
    tableBody.innerHTML = players.map(p => `
      <tr>
        <td>${p.nickname || '-'}</td>
        <td>${p.city || '?'}, ${p.country || '?'}</td>
        <td>🪙 ${(p.balance || 0).toLocaleString('tr-TR')}</td>
        <td>${p.lastSeen ? new Date(p.lastSeen).toLocaleString('tr-TR') : '-'}</td>
      </tr>
    `).join('');
    loginBox.style.display = 'none';
    dashboard.style.display = 'block';
  } catch (e) {
    loginError.textContent = 'Bağlantı hatası: ' + e.message;
  }
}

loginBtn.addEventListener('click', () => {
  adminSecret = secretInput.value;
  sessionStorage.setItem('admin_secret', adminSecret);
  loadPlayers();
});

refreshBtn.addEventListener('click', loadPlayers);

if (adminSecret) {
  loadPlayers();
}
</script>

</body>
</html>
