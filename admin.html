<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Oyuncular</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { font-size: 18px; margin-bottom: 16px; }
  .login-box {
    max-width: 320px;
    margin: 60px auto;
    background: #111c31;
    border: 1px solid #1e293b;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }
  .login-box input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #1e293b;
    background: #0b1220;
    color: #e2e8f0;
    margin: 10px 0;
  }
  .login-box button, .refresh-btn {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #3b82f6;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  .error { color: #fca5a5; font-size: 12px; margin-top: 8px; min-height: 14px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #111c31;
    border-radius: 10px;
    overflow: hidden;
    font-size: 13px;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid #1e293b;
  }
  th { background: #0f172a; color: #93c5fd; font-size: 11px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .refresh-btn { width: auto; padding: 8px 16px; font-size: 13px; }
  .danger-btn {
    width: auto;
    padding: 8px 16px;
    font-size: 12px;
    border-radius: 8px;
    border: 1px solid #7f1d1d;
    background: transparent;
    color: #fca5a5;
    cursor: pointer;
  }
  .danger-btn:hover { background: #7f1d1d33; }
  .row-actions { display: flex; gap: 8px; }
  .delete-link {
    background: none;
    border: none;
    color: #64748b;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }
  .delete-link:hover { color: #fca5a5; }
  .count { font-size: 12px; color: #64748b; margin-bottom: 10px; }
  #dashboard { display: none; }
  #map { height: 340px; width: 100%; border-radius: 10px; margin-bottom: 16px; border: 1px solid #1e293b; }
</style>
</head>
<body>

<div class="login-box" id="loginBox">
  <h1>🔒 Admin Girişi</h1>
  <input type="password" id="secretInput" placeholder="Admin şifresi">
  <button id="loginBtn">Giriş Yap</button>
  <div class="error" id="loginError"></div>
</div>

<div id="dashboard">
  <div class="top-bar">
    <h1>👥 Oyuncular</h1>
    <div class="row-actions">
      <button class="refresh-btn" id="refreshBtn">🔄 Yenile</button>
      <button class="danger-btn" id="clearPlayersBtn">🗑️ Tüm Oyuncuları Temizle</button>
    </div>
  </div>
  <div class="count" id="countText"></div>
  <div id="map"></div>
  <table>
    <thead>
      <tr>
        <th>Oyuncu Adı</th>
        <th>Şehir / Ülke</th>
        <th>Bakiye</th>
        <th>Son Görülme</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div class="top-bar" style="margin-top:24px;">
    <h1 style="font-size:16px;">📧 Ödül Bildirimi İçin Bırakılan E-postalar</h1>
    <button class="danger-btn" id="clearEmailsBtn">🗑️ Tüm E-postaları Temizle</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>E-posta</th>
        <th>Kayıt Tarihi</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="emailTableBody"></tbody>
  </table>
</div>

<script>
const loginBox = document.getElementById('loginBox');
const dashboard = document.getElementById('dashboard');
const secretInput = document.getElementById('secretInput');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const tableBody = document.getElementById('tableBody');
const countText = document.getElementById('countText');
const refreshBtn = document.getElementById('refreshBtn');
const clearPlayersBtn = document.getElementById('clearPlayersBtn');
const clearEmailsBtn = document.getElementById('clearEmailsBtn');

let adminSecret = sessionStorage.getItem('admin_secret') || '';
let map = null;
let markers = [];

function ensureMap() {
  if (map) return;
  map = L.map('map').setView([39.0, 35.0], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap katkıda bulunanları',
    maxZoom: 19
  }).addTo(map);
}

function renderMarkers(players) {
  ensureMap();
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const withCoords = players.filter(p => p.lat != null && p.lng != null);
  withCoords.forEach(p => {
    const marker = L.circleMarker([p.lat, p.lng], {
      radius: 8,
      fillColor: '#38bdf8',
      color: '#fff',
      weight: 2,
      fillOpacity: 0.9
    }).addTo(map);
    marker.bindPopup(`<b>${p.nickname || '-'}</b><br>${p.city || '?'}, ${p.country || '?'}<br>🪙 ${(p.balance || 0).toLocaleString('tr-TR')}<br>${p.lastSeen ? new Date(p.lastSeen).toLocaleString('tr-TR') : ''}`);
    markers.push(marker);
  });

  if (withCoords.length === 1) {
    map.setView([withCoords[0].lat, withCoords[0].lng], 12);
  } else if (withCoords.length > 1) {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.3), { maxZoom: 12 });
  }
}

async function callClearApi(body) {
  const res = await fetch('/api/admin-clear', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-secret': adminSecret },
    body: JSON.stringify(body)
  });
  return res.ok;
}

async function loadPlayers() {
  try {
    const res = await fetch('/api/admin-players', {
      headers: { 'x-admin-secret': adminSecret }
    });
    if (res.status === 401) {
      loginError.textContent = 'Yanlış şifre.';
      sessionStorage.removeItem('admin_secret');
      loginBox.style.display = 'block';
      dashboard.style.display = 'none';
      return;
    }
    const data = await res.json();
    const players = data.players || [];
    countText.textContent = `Toplam ${players.length} oyuncu`;
    renderMarkers(players);
    tableBody.innerHTML = players.length
      ? players.map(p => `
          <tr>
            <td>${p.nickname || '-'}</td>
            <td>${p.city || '?'}, ${p.country || '?'}</td>
            <td>🪙 ${(p.balance || 0).toLocaleString('tr-TR')}</td>
            <td>${p.lastSeen ? new Date(p.lastSeen).toLocaleString('tr-TR') : '-'}</td>
            <td><button class="delete-link" data-player-id="${p.playerId}">sil</button></td>
          </tr>
        `).join('')
      : '<tr><td colspan="5" style="color:#64748b;">Henüz oyuncu yok</td></tr>';

    document.querySelectorAll('.delete-link[data-player-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Bu oyuncuyu silmek istediğine emin misin?')) return;
        btn.disabled = true;
        await callClearApi({ action: 'delete-player', playerId: btn.dataset.playerId });
        loadPlayers();
      });
    });

    loginBox.style.display = 'none';
    dashboard.style.display = 'block';
    setTimeout(() => { if (map) map.invalidateSize(); }, 100);

    // E-posta listesini de yükle
    const emailTableBody = document.getElementById('emailTableBody');
    try {
      const emailRes = await fetch('/api/admin-emails', {
        headers: { 'x-admin-secret': adminSecret }
      });
      const emailData = await emailRes.json();
      const emails = emailData.emails || [];
      emailTableBody.innerHTML = emails.length
        ? emails.map(e => `
            <tr>
              <td>${e.email}</td>
              <td>${e.submittedAt ? new Date(e.submittedAt).toLocaleString('tr-TR') : '-'}</td>
              <td><button class="delete-link" data-email="${e.email}">sil</button></td>
            </tr>
          `).join('')
        : '<tr><td colspan="3" style="color:#64748b;">Henüz e-posta kaydı yok</td></tr>';

      document.querySelectorAll('.delete-link[data-email]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Bu e-postayı silmek istediğine emin misin?')) return;
          btn.disabled = true;
          await callClearApi({ action: 'delete-email', email: btn.dataset.email });
          loadPlayers();
        });
      });
    } catch (e) {}
  } catch (e) {
    loginError.textContent = 'Bağlantı hatası: ' + e.message;
  }
}

loginBtn.addEventListener('click', () => {
  adminSecret = secretInput.value;
  sessionStorage.setItem('admin_secret', adminSecret);
  loadPlayers();
});

refreshBtn.addEventListener('click', loadPlayers);

clearPlayersBtn.addEventListener('click', async () => {
  if (!confirm('TÜM oyuncu kayıtlarını silmek istediğine emin misin? Bu işlem geri alınamaz.')) return;
  clearPlayersBtn.disabled = true;
  await callClearApi({ action: 'clear-players' });
  clearPlayersBtn.disabled = false;
  loadPlayers();
});

clearEmailsBtn.addEventListener('click', async () => {
  if (!confirm('TÜM e-posta kayıtlarını silmek istediğine emin misin? Bu işlem geri alınamaz.')) return;
  clearEmailsBtn.disabled = true;
  await callClearApi({ action: 'clear-emails' });
  clearEmailsBtn.disabled = false;
  loadPlayers();
});

if (adminSecret) {
  loadPlayers();
}
</script>

</body>
</html>
