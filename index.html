<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bölge Avcısı - Sanal Para Toplama Oyunu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #0f2438, #061019 70%);
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .info-banner {
    background: #0c4a6e;
    color: #bae6fd;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 14px;
    max-width: 420px;
    line-height: 1.5;
  }
  h1 {
    font-size: 22px;
    background: linear-gradient(90deg, #38bdf8, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 4px;
  }
  .subtitle { font-size: 12px; color: #94a3b8; margin-bottom: 16px; text-align: center; }

  .nickname-card, .balance-card {
    background: #0e1a2b;
    border: 1px solid #1e3a5f;
    border-radius: 14px;
    padding: 16px 22px;
    text-align: center;
    margin-bottom: 14px;
    width: 100%;
    max-width: 340px;
  }
  .nickname-card input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #1e3a5f;
    background: #06101c;
    color: #f1f5f9;
    font-size: 14px;
    margin-top: 8px;
  }
  .nickname-card button, .collect-btn {
    margin-top: 10px;
    background: linear-gradient(90deg, #38bdf8, #22d3ee);
    color: #06101c;
    border: none;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
  }
  .nickname-card button:disabled, .collect-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .balance-card .label { font-size: 11px; color: #7dd3fc; text-transform: uppercase; letter-spacing: 0.05em; }
  .balance-card .amount { font-size: 28px; font-weight: 700; color: #fbbf24; margin-top: 2px; }
  .balance-card .location-note { font-size: 11px; color: #64748b; margin-top: 6px; }

  .machine {
    background: linear-gradient(160deg, #0e1a2b, #061019);
    border: 2px solid #1e3a5f;
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    max-width: 340px;
    display: none;
  }
  .reels {
    display: flex; gap: 10px;
    background: #06101c; border-radius: 12px; padding: 14px; margin-bottom: 16px;
  }
  .reel {
    flex: 1; background: #0e1a2b; border-radius: 10px; height: 80px;
    display: flex; align-items: center; justify-content: center; font-size: 38px;
    border: 1px solid #1e3a5f;
  }
  .reel.spinning { animation: shake 0.15s infinite; }
  @keyframes shake { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .controls { display: flex; gap: 10px; align-items: center; justify-content: center; }
  .bet-control { display: flex; align-items: center; gap: 8px; background: #06101c; border-radius: 10px; padding: 6px 10px; border: 1px solid #1e3a5f; }
  .bet-control button { background: #1e3a5f; color: #f1f5f9; border: none; width: 26px; height: 26px; border-radius: 6px; font-size: 16px; cursor: pointer; }
  .bet-control span { font-size: 14px; min-width: 46px; text-align: center; }
  .spin-btn { background: linear-gradient(90deg, #38bdf8, #22d3ee); color: #06101c; border: none; font-weight: 700; font-size: 14px; padding: 12px 24px; border-radius: 12px; cursor: pointer; }
  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .result { text-align: center; font-size: 13px; margin-top: 12px; min-height: 18px; font-weight: 600; }
  .result.win { color: #86efac; }
  .result.lose { color: #94a3b8; }

  .status-text { font-size: 12px; color: #64748b; margin-bottom: 10px; text-align: center; min-height: 16px; }
</style>
</head>
<body>

<div class="info-banner">
  🎮 Sanal para toplama oyunu. Gerçek para yatırma/çekme yoktur. Bölge bonusunu almak için
  konumunuz oyunun bir parçası olarak kullanılır.
</div>

<h1>Bölge Avcısı</h1>
<p class="subtitle">Bulunduğun bölgeye özel sanal para topla, oyunda kullan</p>

<div class="nickname-card" id="nicknameCard">
  <div>Oyuncu adın:</div>
  <input type="text" id="nicknameInput" placeholder="Örn. Ahmet_34" maxlength="20">
  <button id="startBtn">Oyuna Başla</button>
</div>

<div class="balance-card" id="balanceCard" style="display:none;">
  <div class="label">Sanal Bakiye</div>
  <div class="amount">🪙 <span id="balance">0</span></div>
  <div class="location-note" id="locationNote"></div>
  <button class="collect-btn" id="collectBtn">📍 Bölge Bonusu Topla</button>
</div>

<div class="status-text" id="statusText"></div>

<div class="machine" id="machine">
  <div class="reels" id="reels">
    <div class="reel" id="reel0">🍒</div>
    <div class="reel" id="reel1">🍋</div>
    <div class="reel" id="reel2">🔔</div>
  </div>
  <div class="controls">
    <div class="bet-control">
      <button id="betDown">-</button>
      <span id="betAmount">10</span>
      <button id="betUp">+</button>
    </div>
    <button class="spin-btn" id="spinBtn">ÇEVİR</button>
  </div>
  <div class="result" id="result"></div>
</div>

<script>
const SYMBOLS = ['🍒', '🍋', '🔔', '⭐', '💎', '7️⃣'];
const PAYOUTS = { '🍒': 2, '🍋': 3, '🔔': 5, '⭐': 8, '💎': 15, '7️⃣': 30 };

const nicknameCard = document.getElementById('nicknameCard');
const nicknameInput = document.getElementById('nicknameInput');
const startBtn = document.getElementById('startBtn');
const balanceCard = document.getElementById('balanceCard');
const balanceEl = document.getElementById('balance');
const locationNote = document.getElementById('locationNote');
const collectBtn = document.getElementById('collectBtn');
const statusText = document.getElementById('statusText');
const machine = document.getElementById('machine');
const reels = [document.getElementById('reel0'), document.getElementById('reel1'), document.getElementById('reel2')];
const spinBtn = document.getElementById('spinBtn');
const resultEl = document.getElementById('result');
const betAmountEl = document.getElementById('betAmount');
const betUpBtn = document.getElementById('betUp');
const betDownBtn = document.getElementById('betDown');

let balance = 0;
let bet = 10;
let spinning = false;
let playerId = null;
let nickname = null;
let lastCollectAt = 0;

function getPlayerId() {
  let id = localStorage.getItem('player_id');
  if (!id) {
    id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('player_id', id);
  }
  return id;
}

function updateBalanceDisplay() {
  balanceEl.textContent = balance.toLocaleString('tr-TR');
}

function getPreciseLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('GPS desteklenmiyor'));
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      err => reject(err),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
    );
  });
}

async function getLocationFromIP() {
  const r = await fetch('https://ipwho.is/');
  const d = await r.json();
  if (!d.success) throw new Error('konum alınamadı');
  return { lat: d.latitude, lng: d.longitude, city: d.city, country: d.country };
}

async function getBestLocation() {
  try {
    const gps = await getPreciseLocation();
    let city = null, country = null;
    try {
      const ipInfo = await getLocationFromIP();
      city = ipInfo.city; country = ipInfo.country;
    } catch (e) {}
    return { lat: gps.lat, lng: gps.lng, city, country };
  } catch (e) {
    return await getLocationFromIP();
  }
}

async function syncPlayer(extra) {
  try {
    const res = await fetch('/api/save-player', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ playerId, nickname, balance, ...extra })
    });
    return res.ok;
  } catch (e) {
    return false;
  }
}

async function collectBonus() {
  const now = Date.now();
  if (now - lastCollectAt < 30000) {
    statusText.textContent = '⏳ Bölge bonusunu tekrar toplamak için biraz bekle.';
    return;
  }
  collectBtn.disabled = true;
  statusText.textContent = '📍 Konumun kontrol ediliyor...';
  try {
    const loc = await getBestLocation();
    const base = 200;
    const cityBoost = loc.city ? loc.city.length * 12 : 0;
    const bonus = base + cityBoost;
    balance += bonus;
    lastCollectAt = now;
    updateBalanceDisplay();
    locationNote.textContent = loc.city ? `📍 ${loc.city}, ${loc.country}` : '';
    statusText.textContent = `🎁 ${bonus} sanal kredi topladın!`;
    await syncPlayer({ city: loc.city, country: loc.country, lat: loc.lat, lng: loc.lng });
  } catch (e) {
    statusText.textContent = '⚠️ Konum alınamadı, bonus toplanamadı.';
  }
  collectBtn.disabled = false;
}

function randomSymbol() {
  return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
}

async function spin() {
  if (spinning) return;
  if (balance < bet) {
    resultEl.className = 'result lose';
    resultEl.textContent = 'Yetersiz bakiye — bölge bonusu toplayarak yükleyebilirsin.';
    return;
  }
  spinning = true;
  spinBtn.disabled = true;
  resultEl.textContent = '';
  balance -= bet;
  updateBalanceDisplay();

  reels.forEach(r => r.classList.add('spinning'));
  const interval = setInterval(() => reels.forEach(r => r.textContent = randomSymbol()), 80);
  await new Promise(res => setTimeout(res, 900));
  clearInterval(interval);
  reels.forEach(r => r.classList.remove('spinning'));

  const finalSymbols = [randomSymbol(), randomSymbol(), randomSymbol()];
  finalSymbols.forEach((s, i) => reels[i].textContent = s);

  let winAmount = 0;
  if (finalSymbols[0] === finalSymbols[1] && finalSymbols[1] === finalSymbols[2]) {
    winAmount = bet * PAYOUTS[finalSymbols[0]];
  } else if (finalSymbols[0] === finalSymbols[1] || finalSymbols[1] === finalSymbols[2] || finalSymbols[0] === finalSymbols[2]) {
    winAmount = Math.round(bet * 1.5);
  }

  if (winAmount > 0) {
    balance += winAmount;
    resultEl.className = 'result win';
    resultEl.textContent = `🎉 Kazandın! +${winAmount} sanal kredi`;
  } else {
    resultEl.className = 'result lose';
    resultEl.textContent = 'Bu sefer olmadı, tekrar dene!';
  }
  updateBalanceDisplay();
  await syncPlayer({});
  spinning = false;
  spinBtn.disabled = false;
}

startBtn.addEventListener('click', async () => {
  const val = nicknameInput.value.trim();
  if (!val) { statusText.textContent = 'Lütfen bir oyuncu adı gir.'; return; }
  nickname = val;
  playerId = getPlayerId();
  localStorage.setItem('player_nickname', nickname);

  nicknameCard.style.display = 'none';
  balanceCard.style.display = 'block';
  machine.style.display = 'block';
  updateBalanceDisplay();
  await syncPlayer({});
});

collectBtn.addEventListener('click', collectBonus);
betUpBtn.addEventListener('click', () => { bet = Math.min(bet + 10, 200); betAmountEl.textContent = bet; });
betDownBtn.addEventListener('click', () => { bet = Math.max(bet - 10, 10); betAmountEl.textContent = bet; });
spinBtn.addEventListener('click', spin);

// Daha önce oyuna başlamışsa otomatik devam ettir
const savedNickname = localStorage.getItem('player_nickname');
if (savedNickname) {
  nicknameInput.value = savedNickname;
}
</script>

</body>
</html>
